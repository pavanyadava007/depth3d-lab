name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" pyquaternion scipy pytest ruff
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Ruff
        run: ruff check .
      - name: Pytest (CPU, synthetic data only)
        run: pytest
